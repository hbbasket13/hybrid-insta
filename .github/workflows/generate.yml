name: Weekly generate + render

on:
  schedule:
    - cron: "0 22 * * 6"   # Sunday 08:00 AEST (Saturday 22:00 UTC)
  workflow_dispatch:
    inputs:
      count:
        description: "How many topics to draft"
        default: "3"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Generate drafts with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-5' }}
        run: python scripts/generate.py --count "${{ github.event.inputs.count || '3' }}"
      - name: Render slides
        run: python scripts/render.py
      - name: Commit drafts and assets
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly drafts $(date -u +%F)"
          git push
