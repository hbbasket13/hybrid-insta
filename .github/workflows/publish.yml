name: Daily publish

on:
  schedule:
    - cron: "30 21 * * 0,1,2,3,4"   # Mon–Fri 07:30 AEST (previous day 21:30 UTC). Adjust after daylight saving if you care about the exact hour.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no API calls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish next approved post
        env:
          IG_API: ${{ vars.IG_API || 'instagram' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || format('https://raw.githubusercontent.com/{0}/main', github.repository) }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v21.0' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/publish.py --dry-run
          else
            python scripts/publish.py
          fi
      - name: Commit state
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Published $(date -u +%F)"
          git push
