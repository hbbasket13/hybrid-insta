name: Daily publish

# 6 runs a day, Monday–Saturday Sydney time. Each run publishes ONE due post from approved/
# (3 Korean + 3 English comic posts a day, alternating).
# UTC → Sydney AEDT (Oct–Apr): 07:30 / 09:30 / 12:00 / 15:00 / 18:30 / 20:30. AEST (Apr–Oct): one hour earlier.
on:
  schedule:
    - cron: "30 20 * * 0-5"   # 07:30
    - cron: "30 22 * * 0-5"   # 09:30
    - cron: "0 1 * * 1-6"     # 12:00
    - cron: "0 4 * * 1-6"     # 15:00
    - cron: "30 7 * * 1-6"    # 18:30
    - cron: "30 9 * * 1-6"    # 20:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no API calls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish next approved post
        env:
          TZ: Australia/Sydney
          IG_API: ${{ vars.IG_API || 'instagram' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || format('https://raw.githubusercontent.com/{0}/main', github.repository) }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v21.0' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/publish.py --dry-run
          else
            python scripts/publish.py
          fi
      - name: Commit state
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Published $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push
