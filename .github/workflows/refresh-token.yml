name: Refresh Instagram token

# Long-lived tokens last 60 days; refreshing monthly keeps it alive.
# Needs secrets: IG_ACCESS_TOKEN, GH_PAT (classic PAT with `repo` scope, so the job can write the secret back).
# IG_API=facebook additionally needs FB_APP_ID / FB_APP_SECRET (and is unnecessary if you stored a Page token).
on:
  schedule:
    - cron: "0 20 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Exchange token and store it
        env:
          IG_API: ${{ vars.IG_API || 'instagram' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python scripts/refresh_token.py)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
          echo "Token refreshed."
