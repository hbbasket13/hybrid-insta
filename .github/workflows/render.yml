name: Re-render on edit

# Runs when you push a batch file, or edit a draft/approved JSON, the template or brand config,
# so the PNGs in assets/ always match the text. Template/config changes re-render everything.
on:
  push:
    branches: [main]
    paths:
      - "batches/**"
      - "drafts/**.json"
      - "approved/**.json"
      - "templates/**"
      - "config/brand.json"
      - "config/services.json"
      - "scripts/sydney_only.py"
      - "scripts/remove_excluded.py"
      - "config/excluded_topics.json"
      - "scripts/no_private_insurance.py"
  workflow_dispatch:
    inputs:
      all:
        description: "Re-render every post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Import scheduled batches
        run: python scripts/import_batch.py
      - name: Keep posts Sydney-only
        run: python scripts/sydney_only.py
      - name: Remove excluded topics
        run: python scripts/remove_excluded.py
      - name: Remove private health insurance mentions
        run: python scripts/no_private_insurance.py
      - name: Render
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(templates/|config/|scripts/sydney_only.py|scripts/no_private_insurance.py)'; then
            python scripts/render.py --all
          else
            python scripts/render.py
          fi
      - name: Commit assets
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import + render $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push
