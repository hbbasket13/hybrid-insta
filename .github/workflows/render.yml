name: Re-render on edit

# Runs when you push a batch file, or edit a draft/approved JSON, the template or brand config,
# so the PNGs in assets/ always match the text.
on:
  push:
    branches: [main]
    paths:
      - "batches/**"
      - "drafts/**.json"
      - "approved/**.json"
      - "templates/**"
      - "config/brand.json"
      - "config/services.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Import scheduled batches
        run: python scripts/import_batch.py
      - name: Render changed drafts
        run: python scripts/render.py
      - name: Commit assets
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import + render $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push
