name: Re-render on edit

# Runs when you edit a draft/approved JSON, the template or brand config in the GitHub web UI,
# so the PNGs in assets/ always match the text.
on:
  push:
    branches: [main]
    paths:
      - "drafts/**.json"
      - "approved/**.json"
      - "templates/**"
      - "config/brand.json"
      - "config/services.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Render changed drafts
        run: python scripts/render.py
      - name: Commit assets
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Re-render assets"
          git push
